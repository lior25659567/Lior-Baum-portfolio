<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The pixel theme is light-only by design: flat #FFFFFF, hairlines, hard
         edges. Declaring `light` alone stops mobile browsers force-inverting it. -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="robots" content="noindex" />
    <!-- The reference site uses SNEAK by TIGHTYPE (commercial licence; their
         font files are not copied here). Switzer is the free Helvetica-register
         stand-in until Sneak is licensed. The other three faces stay loaded only
         for the /#/type comparison page. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=Inter:wght@400;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" />
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@400,600,700&display=swap" />
    <title>Pixel theme — Lior Baum</title>
  </head>
  <body>
    <div id="pixel-root"></div>
    <script type="module" src="/src/themes/pixel/main.jsx"></script>
  </body>
</html>
